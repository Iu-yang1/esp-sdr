name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test artifact export
        run: python3 -m unittest discover -s tests
      - id: catalog
        run: echo "matrix=$(python3 tools/build_firmware.py --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out pinned ESP-IDF
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: ${{ matrix.idf_ref }}
          path: .esp-idf
          submodules: recursive
      - name: Cache SDK tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ runner.os }}-${{ runner.arch }}-${{ matrix.idf_ref }}-${{ matrix.target }}
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev python3-venv libusb-1.0-0
      - name: Install SDK tools
        env:
          IDF_TARGET_NAME: ${{ matrix.target }}
        run: .esp-idf/install.sh "$IDF_TARGET_NAME"
      - name: Build and export
        shell: bash
        env:
          PROFILE: ${{ matrix.id }}
          FIRMWARE_VERSION: ${{ github.sha }}
        run: |
          source .esp-idf/export.sh
          python tools/build_firmware.py --profile "$PROFILE" --version "$FIRMWARE_VERSION" --output artifacts
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
      # Research-only inventory; never gate stable RX builds on uncertain vendor
      # symbol availability. The JSON is uploaded independently of firmware.
      - name: Audit S31 PHY TX symbols and focused disassembly
        if: matrix.target == 'esp32s31'
        continue-on-error: true
        shell: bash
        env:
          PROFILE: ${{ matrix.id }}
        run: |
          source .esp-idf/export.sh
          python3 tools/s31_tx_phy_audit.py --sdk .esp-idf --profile "$PROFILE" --strict-sdk \
            --output "artifacts/s31-phy-tx-${PROFILE}.json"
      - name: Audit S31 ROM TX control paths
        if: matrix.target == 'esp32s31'
        continue-on-error: true
        shell: bash
        env:
          PROFILE: ${{ matrix.id }}
        run: |
          source .esp-idf/export.sh
          python3 tools/s31_tx_rom_audit.py --sdk .esp-idf --profile "$PROFILE" --strict-sdk \
            --rom-elf "${ESP_ROM_ELF_DIR}/esp32s31_rev0_rom.elf" \
            --output "artifacts/s31-rom-tx-${PROFILE}.json"
      - name: Upload S31 PHY TX audit
        if: always() && matrix.target == 'esp32s31'
        uses: actions/upload-artifact@v4
        with:
          name: research-s31-phy-${{ matrix.id }}
          path: |
            artifacts/s31-phy-tx-${{ matrix.id }}.json
            artifacts/s31-rom-tx-${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            build-${{ matrix.id }}/log/
            build-${{ matrix.id }}/sdkconfig
          retention-days: 7

  s31_tx_lab:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out pinned S31 burst SDK for the research lab
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: 26dd2948925d44f41e3bb614fb044b7a0839a242
          path: .esp-idf
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ runner.os }}-${{ runner.arch }}-26dd2948925d44f41e3bb614fb044b7a0839a242-esp32s31
      - name: Install research build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev python3-venv libusb-1.0-0
          .esp-idf/install.sh esp32s31
      - name: Build RF-disabled register preflight firmware
        shell: bash
        env:
          FIRMWARE_VERSION: ${{ github.sha }}
        run: |
          source .esp-idf/export.sh
          python tools/build_firmware.py --profile esp32s31 --s31-tx-lab \
            --version "$FIRMWARE_VERSION" --output research-artifacts
      - name: Upload separate S31 TX lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-s31-tx-lab
          path: research-artifacts/esp32s31txlab/
          if-no-files-found: error
          retention-days: 30

  bundle:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: downloaded-firmware
          merge-multiple: false
      - name: Collect firmware and combined manifest
        run: python3 tools/collect_firmware.py --input downloaded-firmware --output firmware --catalog firmware-targets.json
      - name: Upload complete firmware set
        uses: actions/upload-artifact@v4
        with:
          name: esp-sdr-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 90
